name: Build Packages

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
    paths:
      - 'Dockerfile'

jobs:

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get version
        run: |
          VERSION=$(grep -i '^FROM ' Dockerfile | head -n 1 | awk -F':' '{print $2}' | awk -F'@' '{print $1}' | awk '{print $1}')
          if [ -z "${VERSION}" ]; then
            echo "::error::Failed to extract VERSION tag from Dockerfile FROM line."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/jgigantino31/swag:latest, ghcr.io/jgigantino31/swag:${{ env.VERSION }}
